<strong>{{ index_bytes | bytes }}</strong> of {{ index_limit | bytes }} {{ meter_label }}
<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="{{ index_limit }}" aria-valuenow="{{ meter_now }}" aria-label="{% if meter_label == 'search index' %}Search index toward the storage quota{% else %}Extracted text toward the index limit{% endif %}">
  <span style="width: {{ percent }}%"></span>
</div>
<p>Source files stored: {{ source_bytes | bytes }}</p>
