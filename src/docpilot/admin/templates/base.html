<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}DocPilot admin{% endblock %}</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  {% block extra_head %}{% endblock %}
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4ddd2;
      --paper: #f7f4ef;
      --card: #fffdf9;
      --accent: #0f6b4c;
      --danger: #8f2d2d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    h2 { font-size: 1.1rem; margin: 28px 0 12px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: #0C2340;
      color: #F4F0E6;
    }
    header img { width: 36px; height: 36px; }
    header > a {
      color: #F4F0E6;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
    }
    .admin-menu { margin-left: auto; position: relative; }
    .admin-menu summary {
      cursor: pointer;
      font-weight: 700;
      list-style: none;
    }
    .admin-menu summary::-webkit-details-marker { display: none; }
    .admin-menu div {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 200px;
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 0;
      z-index: 2;
    }
    .admin-menu a,
    .admin-menu button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 8px 14px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 400;
      text-align: left;
      text-decoration: none;
    }
    .admin-menu form { margin: 0; padding: 0; border: 0; background: transparent; }
    form, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    label { display: block; font-size: 0.85rem; margin-bottom: 10px; }
    input[type="text"], input[type="password"], input[type="url"], input[type="file"] {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      font: inherit;
    }
    button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button.quiet, a.quiet {
      display: inline-block;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      text-decoration: none;
    }
    .form-actions { display: flex; gap: 8px; align-items: center; }
    button.danger, a.danger {
      display: inline-block;
      background: var(--danger);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    .row label { flex: 1; min-width: 180px; }
    .banner { padding: 10px 12px; border-radius: 8px; margin: 12px 0; }
    .banner.error { background: #fde8e8; color: var(--danger); }
    .banner.notice { background: #e7f6ee; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; background: var(--card); }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 0.78rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
    .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.85rem; }
    .status-ready { background: #e7f6ee; }
    .status-failed { background: #fde8e8; }
    .status-queued, .status-processing { background: #fff4d6; }
    .meter { height: 10px; background: #efeae3; border-radius: 999px; overflow: hidden; }
    .meter span { display: block; height: 100%; background: var(--accent); }
    .upload-meter { margin-top: 8px; }
    .upload-meter.working span {
      width: 40%;
      animation: upload-working 1.1s ease-in-out infinite;
    }
    @keyframes upload-working {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(280%); }
    }
    .actions form { padding: 0; border: 0; background: transparent; margin: 0; }
    #catalog-panel { overflow-x: auto; }
    #catalog-panel table { width: auto; }
    #catalog-panel .nowrap { white-space: nowrap; }
    button.icon {
      background: transparent;
      color: var(--danger);
      padding: 4px;
      line-height: 0;
    }
    button.icon:hover { background: #fde8e8; }
    .confirm { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
    .confirm[hidden] { display: none; }
    .confirm p { margin: 0; }
    textarea {
      display: block;
      width: 100%;
      margin-top: 4px;
      min-height: 7rem;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      font: inherit;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    fieldset { border: 0; margin: 0 0 8px; padding: 0; }
    legend { font-size: 0.85rem; margin-bottom: 8px; }
    #catalog-summary-draft { margin-bottom: 12px; }
    .top { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .top form { padding: 0; border: 0; background: transparent; }
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.svg" alt="">
    <a href="/">DocPilot Admin</a>
    {% if signed_in %}
    <details class="admin-menu">
      <summary>Admin</summary>
      <div>
        <a href="/admin">Documents</a>
        <a href="/admin/reset">Reset Catalog</a>
        <a href="/admin/password">Change Password</a>
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit">Sign Out</button>
        </form>
      </div>
    </details>
    {% endif %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <script>
    (function () {
      var DISMISS_MS = 5000;
      var BANNER_KEY = "docpilot-banner";
      var CONNECTION_ERROR = "The connection closed before the server answered.";
      var bannerTimer = 0;
      var pollTimer = 0;
      var loadGeneration = 0;
      var FAST_MS = 2000;
      var IDLE_MS = 30000;

      function pageBanner() {
        return document.getElementById("page-banner");
      }

      function showBanner(kind, message, until) {
        var el = pageBanner();
        if (!el) return;
        el.hidden = false;
        el.className = "banner " + (kind === "error" ? "error" : "notice");
        el.setAttribute("data-autodismiss", "");
        el.textContent = message;
        var delay = typeof until === "number" ? Math.max(0, until - Date.now()) : DISMISS_MS;
        window.clearTimeout(bannerTimer);
        bannerTimer = window.setTimeout(function () {
          el.hidden = true;
          el.textContent = "";
        }, delay);
      }

      function rememberBanner(kind, message) {
        try {
          sessionStorage.setItem(BANNER_KEY, JSON.stringify({
            kind: kind,
            message: message,
            until: Date.now() + DISMISS_MS
          }));
        } catch (error) {
          return;
        }
      }

      function takeSavedBanner() {
        var raw = "";
        try {
          raw = sessionStorage.getItem(BANNER_KEY) || "";
          sessionStorage.removeItem(BANNER_KEY);
        } catch (error) {
          return null;
        }
        if (!raw) return null;
        try {
          var saved = JSON.parse(raw);
        } catch (error) {
          return null;
        }
        if (!saved || !saved.message || saved.until <= Date.now()) return null;
        return saved;
      }

      function restoreBanner() {
        var saved = takeSavedBanner();
        if (saved) {
          showBanner(saved.kind, saved.message, saved.until);
          return;
        }
        var el = pageBanner();
        if (!el || el.hidden) return;
        var text = (el.textContent || "").trim();
        if (!text) return;
        showBanner(el.classList.contains("error") ? "error" : "notice", text);
      }

      function go(url, kind, message) {
        if (message) rememberBanner(kind || "notice", message);
        window.location.assign(url);
      }

      function parseJson(text) {
        try {
          return JSON.parse(text);
        } catch (error) {
          return {};
        }
      }

      function resetUpload(form) {
        form.dataset.sending = "";
        form.removeAttribute("aria-busy");
        var input = document.getElementById("upload-file");
        if (input) {
          input.disabled = false;
          input.value = "";
        }
        var filename = document.getElementById("upload-filename");
        if (filename) filename.textContent = "Choose a PDF or drop it here.";
        var state = document.getElementById("upload-state");
        if (state) {
          state.hidden = true;
          state.textContent = "";
        }
        var progress = document.getElementById("upload-progress");
        if (progress) {
          progress.hidden = true;
          progress.classList.remove("working");
        }
        var bar = document.getElementById("upload-progress-bar");
        if (bar) bar.style.width = "";
      }

      function showUploading(form) {
        var state = document.getElementById("upload-state");
        var progress = document.getElementById("upload-progress");
        var bar = document.getElementById("upload-progress-bar");
        var filename = document.getElementById("upload-filename");
        var input = document.getElementById("upload-file");
        var file = input && input.files && input.files[0];
        if (filename && file) filename.textContent = file.name;
        if (state) {
          state.hidden = false;
          state.className = "banner notice";
          state.textContent = "Uploading…";
        }
        if (progress && bar) {
          progress.hidden = false;
          progress.classList.add("working");
          bar.style.width = "";
          progress.removeAttribute("aria-valuenow");
        }
        form.setAttribute("aria-busy", "true");
      }

      function showReceived() {
        var state = document.getElementById("upload-state");
        var progress = document.getElementById("upload-progress");
        var bar = document.getElementById("upload-progress-bar");
        if (state) state.textContent = "File received. Still working…";
        if (progress && bar) {
          progress.classList.add("working");
          bar.style.width = "";
          progress.removeAttribute("aria-valuenow");
        }
      }

      function showProgress(loaded, total) {
        var progress = document.getElementById("upload-progress");
        var bar = document.getElementById("upload-progress-bar");
        if (!progress || !bar || !total) return;
        var percent = Math.min(100, Math.round((loaded / total) * 100));
        progress.classList.remove("working");
        bar.style.width = percent + "%";
        progress.setAttribute("aria-valuenow", String(percent));
      }

      function loadPanel(id, url, generation) {
        var panel = document.getElementById(id);
        if (!panel) return Promise.resolve();
        return fetch(url, {
          headers: { "Accept": "text/html" },
          credentials: "same-origin"
        }).then(function (response) {
          if (!response.ok) throw new Error("panel");
          return response.text();
        }).then(function (html) {
          if (generation !== loadGeneration) return;
          var current = document.getElementById(id);
          if (!current) return;
          current.innerHTML = html;
          current.removeAttribute("aria-busy");
        }).catch(function () {
          if (generation !== loadGeneration) return;
          var current = document.getElementById(id);
          if (!current || current.getAttribute("aria-busy") !== "true") return;
          current.innerHTML = "<p>Could not load this section.</p>";
          current.removeAttribute("aria-busy");
        });
      }

      function loadPanels() {
        if (!document.getElementById("catalog-panel")) return Promise.resolve();
        var generation = ++loadGeneration;
        return Promise.all([
          loadPanel("usage-panel", "/admin/api/usage", generation),
          loadPanel("catalog-panel", "/admin/api/catalog", generation),
          loadPanel("audit-panel", "/admin/api/audit", generation)
        ]).then(function () {
          if (generation === loadGeneration) schedulePoll();
        });
      }

      function schedulePoll() {
        window.clearTimeout(pollTimer);
        var busy = document.querySelector("#catalog-panel .status-queued, #catalog-panel .status-processing");
        pollTimer = window.setTimeout(loadPanels, busy ? FAST_MS : IDLE_MS);
      }

      function handleResponse(form, status, payload) {
        form.dataset.sending = "";
        if (!status) {
          if (form.id === "upload-form") resetUpload(form);
          showBanner("error", CONNECTION_ERROR);
          return;
        }
        var message = payload.message || "";
        if (status < 200 || status >= 300) {
          if (form.id === "upload-form") resetUpload(form);
          showBanner("error", message || "The request failed.");
          return;
        }
        if (payload.next) {
          go(payload.next, "notice", message);
          return;
        }
        if (form.id === "upload-form") resetUpload(form);
        if (form.id === "catalog-summary-form") {
          applySummary(form, payload);
          rememberSummary();
        }
        if (message) showBanner("notice", message);
        if (document.getElementById("catalog-panel")) loadPanels();
      }

      function sendForm(form, submitter) {
        var body = submitter ? new FormData(form, submitter) : new FormData(form);
        fetch(form.action, {
          method: "POST",
          body: body,
          headers: { "Accept": "application/json" },
          credentials: "same-origin"
        }).then(function (response) {
          return response.text().then(function (text) {
            handleResponse(form, response.status, parseJson(text));
          });
        }).catch(function () {
          form.dataset.sending = "";
          showBanner("error", CONNECTION_ERROR);
        });
      }

      function sendUpload(form) {
        var input = document.getElementById("upload-file");
        var file = input && input.files && input.files[0];
        if (!file) {
          form.dataset.sending = "";
          showBanner("error", "Choose a PDF to upload.");
          return;
        }
        showUploading(form);
        var body = new FormData();
        var csrf = form.querySelector('input[name="csrf"]');
        body.append("csrf", csrf ? csrf.value : "");
        body.append("file", file, file.name);
        window.setTimeout(function () {
          input.disabled = true;
        }, 0);
        var xhr = new XMLHttpRequest();
        xhr.open("POST", form.action);
        xhr.setRequestHeader("Accept", "application/json");
        xhr.upload.addEventListener("progress", function (event) {
          if (event.lengthComputable) showProgress(event.loaded, event.total);
        });
        xhr.upload.addEventListener("load", showReceived);
        xhr.addEventListener("load", function () {
          handleResponse(form, xhr.status, parseJson(xhr.responseText || ""));
        });
        xhr.addEventListener("error", function () {
          form.dataset.sending = "";
          resetUpload(form);
          showBanner("error", CONNECTION_ERROR);
        });
        xhr.send(body);
      }

      var pendingDelete = null;

      function askDelete(form) {
        var csrf = form.querySelector('input[name="csrf"]');
        var row = form.closest("tr");
        var title = "this document";
        if (row && row.cells[0]) {
          title = (row.cells[0].innerText || "").split("\n")[0].trim() || title;
        }
        pendingDelete = {
          action: form.action,
          csrf: csrf ? csrf.value : ""
        };
        var question = document.getElementById("delete-question");
        var box = document.getElementById("delete-confirm");
        if (question) question.textContent = "Delete " + title + "?";
        if (box) box.hidden = false;
        var yes = document.getElementById("delete-yes");
        if (yes) yes.focus();
      }

      function closeDelete() {
        pendingDelete = null;
        var box = document.getElementById("delete-confirm");
        if (box) box.hidden = true;
      }

      function confirmDelete() {
        var pending = pendingDelete;
        closeDelete();
        if (!pending) return;
        var body = new FormData();
        body.append("csrf", pending.csrf);
        fetch(pending.action, {
          method: "POST",
          body: body,
          headers: { "Accept": "application/json" },
          credentials: "same-origin"
        }).then(function (response) {
          return response.text().then(function (text) {
            handleResponse(document.createElement("form"), response.status, parseJson(text));
          });
        }).catch(function () {
          showBanner("error", CONNECTION_ERROR);
        });
      }

      document.addEventListener("submit", function (event) {
        var form = event.target;
        if (!form || form.tagName !== "FORM") return;
        event.preventDefault();
        if (form.dataset.sending === "1") return;
        if (form.id === "catalog-summary-form") {
          var save = document.getElementById("catalog-summary-save");
          if (save && save.disabled) return;
        }
        if (form.action.indexOf("/delete") !== -1) {
          askDelete(form);
          return;
        }
        form.dataset.sending = "1";
        if (form.id === "upload-form") sendUpload(form);
        else sendForm(form, event.submitter || null);
      });

      var deleteYes = document.getElementById("delete-yes");
      var deleteNo = document.getElementById("delete-no");
      if (deleteYes) deleteYes.addEventListener("click", confirmDelete);
      if (deleteNo) deleteNo.addEventListener("click", closeDelete);

      var SUMMARY_FIELDS = ["title", "summary", "question_1", "question_2", "question_3"];
      var summarySaved = "";

      function summaryForm() {
        return document.getElementById("catalog-summary-form");
      }

      function summaryValues(form) {
        return SUMMARY_FIELDS.map(function (name) {
          var field = form.elements[name];
          return field ? field.value : "";
        }).join("\u0000");
      }

      function rememberSummary() {
        var form = summaryForm();
        if (!form) return;
        summarySaved = summaryValues(form);
        var save = document.getElementById("catalog-summary-save");
        if (save) save.disabled = true;
      }

      function refreshSummarySave() {
        var form = summaryForm();
        var save = document.getElementById("catalog-summary-save");
        if (!form || !save) return;
        save.disabled = summaryValues(form) === summarySaved;
      }

      function applySummary(form, payload) {
        if (!form || !payload || !payload.questions) return;
        if (form.elements.title) form.elements.title.value = payload.title || "";
        if (form.elements.summary) form.elements.summary.value = payload.summary || "";
        var questions = payload.questions;
        if (form.elements.question_1) form.elements.question_1.value = questions[0] || "";
        if (form.elements.question_2) form.elements.question_2.value = questions[1] || "";
        if (form.elements.question_3) form.elements.question_3.value = questions[2] || "";
      }

      function fillSummary() {
        var form = summaryForm();
        var draft = document.getElementById("catalog-summary-draft");
        if (!form || !draft || draft.disabled) return;
        var label = draft.textContent;
        draft.disabled = true;
        draft.textContent = "Working…";
        var csrf = form.querySelector('input[name="csrf"]');
        var body = new FormData();
        body.append("csrf", csrf ? csrf.value : "");
        fetch("/admin/api/catalog-summary/draft", {
          method: "POST",
          body: body,
          headers: { "Accept": "application/json" },
          credentials: "same-origin"
        }).then(function (response) {
          return response.text().then(function (text) {
            var payload = parseJson(text);
            if (response.status < 200 || response.status >= 300) {
              showBanner("error", payload.message || "The request failed.");
              return;
            }
            applySummary(form, payload);
            refreshSummarySave();
          });
        }).catch(function () {
          showBanner("error", CONNECTION_ERROR);
        }).then(function () {
          draft.disabled = false;
          draft.textContent = label;
        });
      }

      var summary = summaryForm();
      if (summary) {
        rememberSummary();
        summary.addEventListener("input", refreshSummarySave);
        var draftButton = document.getElementById("catalog-summary-draft");
        if (draftButton) draftButton.addEventListener("click", fillSummary);
      }

      restoreBanner();
      loadPanels();
    })();
  </script>
</body>
</html>
