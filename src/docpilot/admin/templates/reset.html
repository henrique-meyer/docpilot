{% extends "base.html" %}
{% block title %}Reset catalog · DocPilot admin{% endblock %}
{% block body %}
  <h1>Reset catalog</h1>
  <p>This deletes every document, the catalog, the audit log, and the search index. The admin password stays.</p>
  <form method="post" action="/admin/reset">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="danger" type="submit" name="confirm" value="yes">Yes</button>
    <button class="quiet" type="submit" name="confirm" value="no">No</button>
  </form>
{% endblock %}
