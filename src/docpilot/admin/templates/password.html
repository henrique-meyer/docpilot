{% extends "base.html" %}
{% block title %}Password · DocPilot admin{% endblock %}
{% block body %}
  <h1>Password</h1>
  <p>Set a new admin password. Use at least 8 characters. This session stays signed in.</p>
  {% if error %}<div class="banner error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>New password
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>
    <div class="form-actions">
      <button type="submit">Update password</button>
      <a class="quiet" href="/admin">Cancel</a>
    </div>
  </form>
{% endblock %}
