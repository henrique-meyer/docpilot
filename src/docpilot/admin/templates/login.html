{% extends "base.html" %}
{% block title %}Sign in · DocPilot admin{% endblock %}
{% block body %}
  <h1>DocPilot admin</h1>
  <p>One password protects document upload, replace, and delete.</p>
  {% if notice %}<div class="banner notice">{{ notice }}</div>{% endif %}
  {% if error %}<div class="banner error">{{ error }}</div>{% endif %}
  {% if csrf %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  {% endif %}
{% endblock %}
