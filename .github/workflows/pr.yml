name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          curl -fsSL -o bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep build infra/main.bicep

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint, typecheck, and test
        run: |
          uv sync --group dev
          uv run ruff check src tests
          uv run mypy src
          uv run pytest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: docpilot:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
