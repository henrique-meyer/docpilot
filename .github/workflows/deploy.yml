name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/henrique-meyer/docpilot
          tags: |
            type=sha,format=long
            type=raw,value=prod

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This account uses GitHub's unique OIDC subject, so the Entra
      # federated credential subject includes the owner and repo ids.
      - uses: azure/login@v2
        with:
          client-id: 17e5dffa-f6e7-4468-9592-d18632691dcf
          tenant-id: 161b1a40-af03-4f82-8a3f-76578be5f1bd
          subscription-id: e72b1124-7c1d-4e40-8f8e-4ec965064677

      - name: Let Container Apps pull the image
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            /user/packages/container/docpilot/visibility \
            --input - <<< '{"visibility":"public"}'

      - name: Update the container app in hmeyer-docpilot
        run: |
          az containerapp update \
            --subscription e72b1124-7c1d-4e40-8f8e-4ec965064677 \
            --resource-group hmeyer-docpilot \
            --name ca-docpilot-prod \
            --image "ghcr.io/henrique-meyer/docpilot:prod"
          az containerapp ingress update \
            --subscription e72b1124-7c1d-4e40-8f8e-4ec965064677 \
            --resource-group hmeyer-docpilot \
            --name ca-docpilot-prod \
            --target-port 8000 \
            --type external
